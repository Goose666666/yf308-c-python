<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器学习及实战 · YF308AI实验室开放学习平台</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/logo-180.png">
<!-- 讲义里的公式用 KaTeX 排版；加载不到时 lecture.js 退回显示 TeX 原文 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#1b1b1b; --muted:#6b6b6b; --line:#e6e6e6; --card:#fafafa;
  --code-bg:#f6f6f6; --accent:#222; --ok:#2f7d3a; --warn:#8a6d00; --pill:#f0f0f0;
  --mono:"Cascadia Code",Consolas,"SF Mono",Menlo,"Microsoft YaHei",monospace;
  --headbg:#ebedf2;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151515; --fg:#e9e9e9; --muted:#9b9b9b; --line:#2b2b2b; --card:#1d1d1d;
    --code-bg:#191919; --accent:#e9e9e9; --ok:#7bc888; --warn:#d8bd5a; --pill:#242424; --headbg:#242731;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
}
:root[data-theme="light"]{ --bg:#fff;--fg:#1b1b1b;--muted:#6b6b6b;--line:#e6e6e6;--card:#fafafa;--code-bg:#f6f6f6;--accent:#222;--ok:#2f7d3a;--warn:#8a6d00;--pill:#f0f0f0;--headbg:#ebedf2;}
:root[data-theme="dark"]{ --bg:#151515;--fg:#e9e9e9;--muted:#9b9b9b;--line:#2b2b2b;--card:#1d1d1d;--code-bg:#191919;--accent:#e9e9e9;--ok:#7bc888;--warn:#d8bd5a;--pill:#242424;--headbg:#242731;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
code{font-family:var(--mono)}
/* 按钮和输入框默认不继承字体，会掉回 Arial，和正文不是一套 */
button,input,select,textarea{font-family:inherit}

/* 布局 */
.app{display:flex;align-items:flex-start;max-width:1180px;margin:0 auto}
.sidebar{position:sticky;top:0;align-self:flex-start;width:212px;flex:0 0 212px;height:100vh;
  overflow-y:auto;border-right:1px solid var(--line);padding:1.5rem .8rem}
.sidebar .brand{margin:0 .4rem 1.1rem}
.sidebar .brand .back{display:inline-block;color:var(--muted);font-size:.82rem;
  text-decoration:none;padding:0 0 .5rem}
.sidebar .brand .back:hover{color:var(--fg)}
.brand-mini{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mini img{width:26px;height:26px}
.brand-mini span{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.sidebar .brand .tname{font-weight:700;font-size:1.02rem;line-height:1.4;margin-top:.3rem}
.content{flex:1;min-width:0;padding:1.8rem 1.7rem 4rem}
.part-title{font-size:1.4rem;font-weight:700;margin:0 0 1.4rem;
  padding-bottom:.7rem;border-bottom:2px solid var(--line)}
.view{display:none}
.view.on{display:block}
.vtoggle{display:flex;gap:.25rem;background:var(--pill);border-radius:999px;padding:.25rem;margin-bottom:1.1rem}
.vtoggle button{flex:1;border:0;background:transparent;color:var(--muted);padding:.45rem 0;
  border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem}
.vtoggle button.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
.chaps{display:flex;flex-direction:column;gap:.15rem}
.chaps .chap{text-align:left;border:0;background:transparent;color:var(--fg);
  padding:.52rem .6rem;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.12s;width:100%}
.chaps .chap:hover{background:var(--card)}
.chaps .chap.on{background:var(--accent);color:var(--bg);font-weight:600}
.subs{display:flex;flex-direction:column;gap:.04rem;margin:.15rem 0 .4rem;
  border-left:2px solid var(--line);padding-left:.3rem;margin-left:.5rem}
.chaps .sub{display:block;text-align:left;border:0;background:transparent;color:var(--muted);
  margin:0;max-width:none;width:100%;
  padding:.32rem .55rem;border-radius:6px;cursor:pointer;font-size:.79rem;line-height:1.35;transition:.12s}
.chaps .sub:hover{background:var(--card);color:var(--fg)}
.fontctl{display:flex;align-items:center;gap:.4rem;margin-top:1.4rem;padding:0 .4rem;color:var(--muted);font-size:.82rem}
.fontctl button{border:1px solid var(--line);background:var(--bg);color:var(--fg);width:28px;height:26px;border-radius:6px;cursor:pointer;font-size:.85rem}
.fontctl button:hover{background:var(--card)}
.theme{position:fixed;top:1rem;right:1rem;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem;z-index:30}
footer{color:var(--muted);font-size:.86rem;padding:1.6rem 1.2rem 3rem;border-top:1px solid var(--line);max-width:1000px;margin:2rem auto 0}

/* 讲义正文 */
.sec{max-width:880px;margin:0 auto 1.4rem;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:10px;background:var(--headbg);padding:.85rem 1.15rem;
  font-weight:700;font-size:1.02rem;cursor:pointer;user-select:none}
.sec-h:hover .caret{color:var(--fg)}
.caret{flex:none;width:14px;color:var(--muted);font-size:11px;transition:transform .15s}
.caret::before{content:"▼";display:block}
.sec.off .caret{transform:rotate(-90deg)}
.sec.off .sec-b{display:none}
.sec-b{padding:.3rem 1.15rem 1.1rem;font-size:.95rem}
.sec-b p{margin:.7rem 0}
.sec-b ul,.sec-b ol{margin:.6rem 0;padding-left:1.4rem}
.sec-b li{margin:.2rem 0}
.sec-b>p>code,.sec-b li code,.sec-b td code,.sec-b th code{background:var(--code-bg);
  border:1px solid var(--line);border-radius:5px;padding:.05rem .32rem;font-size:.9em}
.sec-b img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.lec-h{font-size:1.02rem;font-weight:700;margin:1.9rem 0 .8rem;line-height:1.55}
.lec-cap{font-size:13px;font-weight:650;color:var(--muted);margin:0 0 .4rem}
.sec-b>.lec-h:first-child{margin-top:.7rem}
:root{ --fig:#30385c; --fig-soft:rgba(48,56,92,.07) }
:root[data-theme=dark]{ --fig:#9fb0e8; --fig-soft:rgba(159,176,232,.10) }

.lec-core{position:relative;margin:.9rem 0 1.3rem;padding:20px 22px 6px;border:1px solid var(--fig);
  border-radius:12px;background:var(--fig-soft)}
.lec-core-k{position:absolute;top:-10px;left:18px;background:var(--bg);padding:0 8px;
  font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--fig)}
.lec-core p{margin:0 0 14px}
.lec-key{background:var(--fig-soft);color:inherit;border-radius:4px;padding:1px 5px;font-weight:650}

.lec-math{overflow-x:auto;overflow-y:hidden;margin:.9rem 0;padding:.2rem 0}
.katex{font-size:1.06em}
.lec-tbl{overflow-x:auto;margin:.85rem 0}
.lec-tbl table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.lec-tbl th,.lec-tbl td{border:1px solid var(--line);padding:.45rem .7rem;text-align:left;vertical-align:top}
.lec-tbl th{background:var(--card);font-weight:600}
.snip{margin:.85rem 0;border:1px solid #2b2b2b;border-radius:8px;overflow:hidden;background:#1e1e1e}
.snip pre{margin:0;padding:.75rem 1rem;overflow-x:auto;color:#d4d4d4;
  font-family:var(--mono);font-size:var(--edfs,14px);line-height:1.6;tab-size:4}
.snip-bar{display:flex;justify-content:flex-end;padding:.4rem .5rem;background:#181818;border-top:1px solid #2b2b2b}
.snip-bar button{border:1px solid #3a3a3a;background:#252525;color:#d4d4d4;font-size:.83rem;
  padding:.4rem .9rem;border-radius:6px;cursor:pointer}
.snip-bar button:hover{background:#303030;color:#fff}

/* 练习卡片 */
.ex{border:1px solid var(--line);border-radius:14px;margin:1.2rem auto;max-width:880px;
  overflow:hidden;box-shadow:var(--shadow)}
.ex-h{background:var(--card);padding:.9rem 1.1rem;font-weight:700;display:flex;gap:.6rem;align-items:baseline}
.ex-h .tag{font-size:.72rem;color:var(--bg);background:var(--accent);border-radius:20px;padding:.12rem .6rem;white-space:nowrap}
.ex-b{padding:.5rem 1.1rem 1.1rem}
.ex-b p{margin:.75rem 0}
details.fold{margin:.6rem 0;border:1px solid var(--line);border-radius:9px;background:var(--code-bg)}
details.fold>summary{cursor:pointer;padding:.6rem .95rem;font-size:.9rem;user-select:none;font-weight:600}
details.fold>summary:hover{color:var(--accent)}
details.fold pre{margin:0;padding:.95rem 1.1rem;overflow-x:auto;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.84rem;line-height:1.6;tab-size:4}
details.fold pre.hlpre{background:#1e1e1e;color:#d4d4d4}
.hint{padding:.65rem .95rem;color:var(--muted);font-size:.92rem}
.exp{color:var(--ok);font-weight:700}

/* 代码单元 */
.cell{display:flex;border:1px solid #2b2b2b;border-radius:8px;overflow:hidden;background:#1e1e1e;margin-top:.4rem}
.cell.out{margin-top:.5rem}
.gutter{flex:0 0 54px;background:#181818;padding:.7rem .45rem;text-align:right;
  font-family:var(--mono);font-size:.72rem;color:#6a9bd1;user-select:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.gutter .play{border:0;background:transparent;color:#4ec9b0;cursor:pointer;font-size:1rem;padding:0;line-height:1}
.gutter .play:hover{color:#7fe9d4}
.gutter .outp{color:#c586c0}
.edwrap{position:relative;flex:1;min-width:0}
.edwrap pre.hl,.edwrap textarea{margin:0;padding:.7rem 1rem;box-sizing:border-box;
  font-family:var(--mono);font-size:var(--edfs,14px);line-height:1.6;
  tab-size:4;white-space:pre;overflow-wrap:normal;letter-spacing:0;border:0}
.edwrap pre.hl{position:absolute;inset:0;overflow:hidden;color:#d4d4d4;pointer-events:none}
.edwrap textarea{position:relative;display:block;width:100%;height:var(--cellh,300px);min-height:110px;
  outline:0;resize:vertical;background:transparent;color:transparent;caret-color:#e6e6e6;overflow:auto}
.edwrap textarea::selection{background:#264f78;color:transparent}
.ckw{color:#569cd6}.cst{color:#ce9178}.ccm{color:#6a9955}.cnu{color:#b5cea8}.cbi{color:#dcdcaa}.cpr{color:#c586c0}
.output{margin:0;padding:.7rem 1rem;background:#1e1e1e;color:#d4d4d4;
  font-family:var(--mono);font-size:var(--edfs,14px);line-height:1.55;
  white-space:pre-wrap;max-height:400px;overflow:auto}
.outhead{padding:.45rem 1rem;background:#2a1f1f;color:#e0a0a0;font-size:.82rem;font-weight:600;
  border-bottom:1px solid #3a2a2a}
.figs{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 6px}
.figs img{max-width:100%;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}

/* 操作条与判题 */
.exbar{display:flex;gap:.55rem;align-items:center;margin:.6rem 0;flex-wrap:wrap}
.exbar button{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.88rem;
  height:38px;padding:0 1.05rem;border-radius:7px;cursor:pointer}
.exbar button:hover{background:var(--card)}
.exbar .runall{background:#0e639c;color:#fff;border-color:#0e639c;font-weight:600}
.exbar .runall:hover{background:#1177bb}
.exbar .runall:disabled,.exbar .submit:disabled{opacity:.5;cursor:default}
.exbar .submit{background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:600}
.exbar .submit:hover{background:#388e3c}
.runstat{color:var(--muted);font-size:.85rem;margin-left:auto}
.stdinrow{display:none;margin:.55rem 0 0}
.stdinrow input{width:100%;height:44px;background:var(--code-bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:0 13px;font-size:14px;font-family:var(--mono)}
.stdinrow textarea{width:100%;min-height:62px;background:var(--code-bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:14px;
  font-family:var(--mono);resize:vertical}
.judge{margin:.55rem 0 0;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);font-size:.87rem;line-height:1.7}
.judge.ok{border-color:#2e7d32}
.judge.no{border-color:#b8860b}
.judge .jtitle{font-weight:600;margin-bottom:.35rem}
.judge ul{margin:.3rem 0 0;padding-left:1.2rem}
.judge li{margin:.12rem 0}
.judge li.y{color:#2e7d32}
.judge li.n{color:var(--muted)}
.empty{color:var(--muted);max-width:880px;margin:0 auto}

@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{position:static;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:1rem}
  .content{padding:1.3rem 1.1rem 3rem;width:100%}   /* 竖排时不被宽表格和公式撑出屏幕 */
  .chaps{flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
  .chaps .chap{border:1px solid var(--line);border-radius:999px;padding:.32rem .8rem;font-size:.84rem;width:auto}
  .subs{flex-basis:100%;flex-direction:column;align-items:flex-start;margin:.15rem 0 .4rem 1rem}
}
</style>
</head>
<script src="../assets/theme.js"></script>
<script src="../assets/runner.js"></script>
<script src="../assets/lecture.js"></script>
<body>
<button class="theme" onclick="toggleTheme()" title="切换深浅色">◐</button>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <a class="back" href="../index.html">← 全部课程</a>
      <div class="brand-mini"><img src="../assets/logo.png" alt=""><span>YF308AI实验室开放学习平台</span></div>
      <div class="tname">机器学习及实战</div>
    </div>
    <div class="vtoggle">
      <button id="seg-know" class="on" onclick="setView('know')">知识点</button>
      <button id="seg-lab" onclick="setView('lab')">实战</button>
    </div>
    <nav class="chaps" id="parts"></nav>
    <div class="fontctl">代码字号 <button onclick="setFont(-1)">A-</button><button onclick="setFont(1)">A+</button></div>
  </aside>
  <div class="content">
    <div id="view-know" class="view on">
      <div class="part-title" id="know-title"></div>
      <div id="know-body"></div>
    </div>
    <div id="view-lab" class="view">
      <div class="part-title" id="lab-title"></div>
      <div id="lab-body"></div>
    </div>
    <footer id="foot"></footer>
  </div>
</div>
<script>
/* ---------- 数据 ---------- */
/* 课程内容在 data/course.json。 */

const CN = ["零","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];
let CHAPS = [], LABS = {}, SNIPS = [];
let view = "know", part = 0;
let SK_READY = false;

function chapOf(n){ return CHAPS.find(c => Number(c.n) === Number(n)); }
function labOf(n){ return LABS[String(n)] || LABS[n] || []; }
function partName(n){ const c = chapOf(n); const num = CN[Number(n)] || String(n); return num + " · " + (c ? c.title : ""); }
function escapeHtml(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- Python 语法着色 ---------- */
const KW = new Set(["def","class","return","if","elif","else","for","while","in","not","and","or","is",
  "import","from","as","with","try","except","finally","lambda","yield","pass","break","continue",
  "global","nonlocal","del","raise","assert","None","True","False","async","await"]);
const BI = new Set(["print","range","len","super","self","int","float","str","list","dict","set","tuple",
  "sum","min","max","open","enumerate","zip","sorted","round","abs","isinstance","type",
  "np","pd","plt","fit","predict","predict_proba","transform","fit_transform","score"]);
function highlight(code){
  const e = escapeHtml(code);
  return e.replace(/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+\.?\d*(?:[eE][-+]?\d+)?\b)|([A-Za-z_]\w*)/g,
    function(m, com, str, num, word){
      if(com) return '<span class="ccm">' + com + '</span>';
      if(str) return '<span class="cst">' + str + '</span>';
      if(num) return '<span class="cnu">' + num + '</span>';
      if(word){
        if(KW.has(word)) return '<span class="ckw">' + word + '</span>';
        if(BI.has(word)) return '<span class="cbi">' + word + '</span>';
        return word;
      }
      return m;
    });
}

/* ---------- 编辑器 ---------- */
let EDFS = 14, CID = 0;
function setFont(d){ EDFS = Math.max(10, Math.min(24, EDFS + d)); document.documentElement.style.setProperty("--edfs", EDFS + "px"); }
function onEdit(id){
  setTimeout(function(){ syncStdin(id); }, 0);
  const ta = document.getElementById(id), hl = document.getElementById("hl-" + id);
  if(!ta || !hl) return;
  hl.innerHTML = highlight(ta.value) + "\n";
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
}
function syncScroll(id){
  const ta = document.getElementById(id), hl = document.getElementById("hl-" + id);
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
}
function keyHandler(ev, cid){
  if(ev.key === "Tab"){
    ev.preventDefault();
    const t = ev.target, s = t.selectionStart, en = t.selectionEnd;
    t.value = t.value.slice(0, s) + "    " + t.value.slice(en);
    t.selectionStart = t.selectionEnd = s + 4; onEdit(cid);
  } else if(ev.key === "Enter" && (ev.ctrlKey || ev.metaKey || ev.shiftKey)){
    ev.preventDefault(); runCell(cid);
  }
}
/* 编辑器高度按行数给，短程序不留一大片空白 */
function cellH(code){
  const lines = String(code).split(/\n/).length;
  return Math.min(520, Math.max(150, (lines + 2) * 23));
}
function cellHTML(cid, code){
  const h = cellH(code);
  return `<div class="cell" id="wrap-${cid}" style="--cellh:${h}px">
      <div class="gutter"><button class="play" title="运行" onclick="runCell('${cid}')">▶</button><span>In</span></div>
      <div class="edwrap">
        <pre class="hl" id="hl-${cid}"></pre>
        <textarea class="editor" id="${cid}" spellcheck="false" oninput="onEdit('${cid}')" onscroll="syncScroll('${cid}')" onkeydown="keyHandler(event,'${cid}')">${escapeHtml(code)}</textarea>
      </div>
    </div>
    <div class="cell out" id="outcell-${cid}" style="display:none">
      <div class="gutter"><span class="outp">Out</span></div>
      <div style="flex:1;min-width:0">
        <div class="outhead" id="ohead-${cid}" style="display:none"></div>
        <pre class="output" id="out-${cid}"></pre>
        <div class="figs" id="figs-${cid}"></div>
      </div>
    </div>`;
}

/* ---------- 知识点 ---------- */
function renderKnow(){
  document.getElementById("know-title").textContent = "第" + partName(part);
  const c = chapOf(part);
  SNIPS = [];
  const secs = (c && c.sections) || [];
  if(!secs.length){
    document.getElementById("know-body").innerHTML = '<p class="empty">本章讲义还没有内容。</p>';
    return;
  }
  let h = "";
  secs.forEach(function(s, k){
    const body = Lecture.render(s.body, function(code, lang){
      const pre = '<div class="snip"><pre>' + highlight(code) + '</pre>';
      // 不带语言标记的是运行结果和命令行，不能拿去运行
      if(lang !== "python") return pre + '</div>';
      const i = SNIPS.push(code) - 1;
      return pre + '<div class="snip-bar"><button onclick="sendSnippet(' + i + ')">送到实战里运行</button></div></div>';
    });
    h += `<section class="sec" id="sec-${part}-${k}"><div class="sec-h" onclick="toggleSec(this)"><span class="caret"></span>${escapeHtml(s.h)}</div><div class="sec-b">${body}</div></section>`;
  });
  document.getElementById("know-body").innerHTML = h;
}
function sendSnippet(i){
  const code = SNIPS[i];
  setView("lab");
  const ta = document.querySelector("#ex-demo .cells textarea");
  if(!ta) return;
  document.getElementById("ex-demo").style.display = "block";
  ta.value = code; onEdit(ta.id);
  document.getElementById("wrap-" + ta.id).style.setProperty("--cellh", cellH(code) + "px");
  document.getElementById("ex-demo").scrollIntoView({behavior:"smooth", block:"start"});
  runAll("ex-demo");
}

/* ---------- 实战 ---------- */
function exBody(exId, cid, code){
  return `<div class="cells">${cellHTML(cid, code)}</div>
      <div class="exbar">
        <button class="runall" onclick="runAll('${exId}')">▶ 运行</button>`;
}
function renderLab(){
  document.getElementById("lab-title").textContent = "第" + partName(part);
  const list = labOf(part);
  const dcid = "c" + (CID++);
  let h = `<div class="ex" id="ex-demo" style="display:none"><div class="ex-h">示例代码</div><div class="ex-b">
      ${exBody("ex-demo", dcid, "")}
        <span class="runstat" id="stat-ex-demo"></span>
      </div>
      <div class="stdinrow"><textarea spellcheck="false" placeholder="运行时输入，一行一个"></textarea></div>
    </div></div>`;
  if(!list.length){
    document.getElementById("lab-body").innerHTML = h + '<p class="empty">本章还没有练习。</p>';
    document.querySelectorAll("#lab-body .cells textarea").forEach(t => onEdit(t.id));
    return;
  }
  list.forEach(function(e, k){
    const exId = "ex-" + part + "-" + k, cid = "c" + (CID++);
    const cid2 = cid;
    h += `<div class="ex" id="${exId}"><div class="ex-h"><span class="tag">${escapeHtml(e.tag)}</span>${escapeHtml(e.title)}</div><div class="ex-b">
      <p>${Lecture.inline(e.task)}</p>
      <details class="fold"><summary>提示</summary><div class="hint">${Lecture.inline(e.hint)}</div></details>
      ${exBody(exId, cid2, e.start || "")}
        <button class="submit" onclick="submitEx('${exId}','${idOf(e.tag)}')">提交检查</button>
        <button onclick="resetEx('${exId}', ${part}, ${k})">重置</button>
        <span class="runstat" id="stat-${exId}"></span>
      </div>
      <div class="stdinrow"><textarea spellcheck="false" placeholder="运行时输入，一行一个"></textarea></div>
      <div class="judge" id="judge-${exId}" style="display:none"></div>
      <details class="fold"><summary>参考答案</summary><pre class="hlpre">${highlight(e.sol || "")}</pre>
        <div class="hint"><span class="exp">预期</span>：${Lecture.inline(e.exp)}</div></details>
    </div></div>`;
  });
  document.getElementById("lab-body").innerHTML = h;
  document.querySelectorAll("#lab-body .cells textarea").forEach(t => onEdit(t.id));
}
function idOf(tag){ return String(tag).replace(/^练习\s*/, "").trim(); }
function resetEx(exId, p, k){
  const cells = document.querySelector("#" + exId + " .cells"), cid = "c" + (CID++);
  cells.innerHTML = cellHTML(cid, labOf(p)[k].start || ""); onEdit(cid);
  document.getElementById("stat-" + exId).textContent = "";
  const jd = document.getElementById("judge-" + exId); if(jd) jd.style.display = "none";
}
function syncStdin(id){
  const ta = document.getElementById(id); if(!ta) return;
  const ex = ta.closest(".ex"); if(!ex) return;
  const row = ex.querySelector(".stdinrow"); if(!row) return;
  const need = /\binput\s*\(/.test(ta.value);
  row.style.display = need ? "block" : "none";
}
function stdinOf(ex){
  const row = ex && ex.querySelector(".stdinrow");
  return (row && row.style.display !== "none") ? row.querySelector("textarea").value : "";
}
async function runCell(cid){
  const cells = document.getElementById("wrap-" + cid).closest(".cells");
  await execute(document.getElementById(cid).value, cid, cells.closest(".ex"));
}
async function runAll(exId){
  const ta = document.querySelector("#" + exId + " .cells textarea");
  await execute(ta.value, ta.id, document.getElementById(exId));
}
async function execute(code, cid, ex){
  const outcell = document.getElementById("outcell-" + cid), out = document.getElementById("out-" + cid);
  const head = document.getElementById("ohead-" + cid), figbox = document.getElementById("figs-" + cid);
  const stat = ex.querySelector(".runstat"), btns = ex.querySelectorAll(".play,.runall");
  outcell.style.display = "flex";
  head.style.display = "none"; head.textContent = "";
  out.textContent = (!SK_READY && /\b(?:sklearn|scipy)\b/.test(code))
    ? "运行中。第一次用到 scikit-learn 要下载约 20 MB，稍等一会儿，之后走浏览器缓存。" : "运行中";
  if(figbox) figbox.innerHTML = "";
  stat.textContent = ""; btns.forEach(b => b.disabled = true);
  const t0 = Date.now();
  try{
    const j = await Runner.run(code, stdinOf(ex), "python");
    if(/\b(?:sklearn|scipy)\b/.test(code)) SK_READY = true;
    out.textContent = j.output || (j.figs && j.figs.length ? "" : "运行结束，没有输出。别忘了 print 结果。");
    if(j.ok === false){ head.textContent = "运行出错"; head.style.display = "block"; }
    if(figbox && j.figs && j.figs.length)
      figbox.innerHTML = j.figs.map(b => '<img src="data:image/png;base64,' + b + '">').join("");
  }catch(err){
    out.textContent = "没跑起来：" + err;
  }finally{
    btns.forEach(b => b.disabled = false);
    stat.textContent = "耗时 " + ((Date.now() - t0) / 1000).toFixed(1) + " 秒";
  }
}
async function submitEx(exId, id){
  const ex = document.getElementById(exId);
  const code = ex.querySelector(".cells textarea").value;
  const box = document.getElementById("judge-" + exId);
  const btns = ex.querySelectorAll(".submit,.runall,.play");
  box.style.display = "block"; box.className = "judge"; box.innerHTML = "正在检查";
  btns.forEach(b => b.disabled = true);
  try{
    const j = await Runner.check(code, id, "python", "data/course.json");
    if(j.ok === null || j.ok === undefined){ box.innerHTML = j.msg || "没法判定"; return; }
    box.className = "judge " + (j.ok ? "ok" : "no");
    let h = `<div class="jtitle">${j.ok ? "做对了" : "还没通过"}　${escapeHtml(j.msg || "")}</div><ul>`;
    for(const it of (j.items || [])) h += `<li class="${it.pass ? "y" : "n"}">${it.pass ? "已完成" : "待完成"}　${escapeHtml(it.desc)}</li>`;
    h += "</ul>";
    if(!j.ok && j.output && j.output.trim())
      h += `<div class="jtitle" style="margin-top:.5rem">你的输出</div><pre style="margin:.2rem 0 0;white-space:pre-wrap">${escapeHtml(j.output.slice(0, 1200))}</pre>`;
    box.innerHTML = h;
  }catch(err){
    box.innerHTML = "没跑起来：" + err;
  }finally{ btns.forEach(b => b.disabled = false); }
}

/* ---------- 导航 ---------- */
function renderParts(){
  let h = "";
  for(const c of CHAPS){
    const i = Number(c.n);
    h += `<button class="chap ${i === part ? "on" : ""}" onclick="setPart(${i})">${escapeHtml(partName(i))}</button>`;
    if(i === part) h += `<div class="subs">${subItems()}</div>`;
  }
  document.getElementById("parts").innerHTML = h;
}
function subItems(){
  if(view === "know"){
    const c = chapOf(part);
    return ((c && c.sections) || []).map((s, k) =>
      `<button class="sub" onclick="gotoSec(${k})">${escapeHtml(s.h)}</button>`).join("");
  }
  return labOf(part).map((e, k) =>
    `<button class="sub" onclick="gotoEx('ex-${part}-${k}')">${escapeHtml(e.tag)} ${escapeHtml(e.title)}</button>`).join("");
}
function toggleSec(h){ h.parentNode.classList.toggle("off"); }
function gotoSec(k){
  const el = document.getElementById("sec-" + part + "-" + k);
  if(el){ el.classList.remove("off"); el.scrollIntoView({behavior:"smooth", block:"start"}); }
}
function gotoEx(id){ const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
function setPart(p){
  part = Number(p); renderParts();
  view === "know" ? renderKnow() : renderLab();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setView(v){
  if(view === v && document.getElementById("view-" + v).classList.contains("on")) return;
  view = v;
  document.getElementById("seg-know").classList.toggle("on", v === "know");
  document.getElementById("seg-lab").classList.toggle("on", v === "lab");
  document.getElementById("view-know").classList.toggle("on", v === "know");
  document.getElementById("view-lab").classList.toggle("on", v === "lab");
  renderParts();
  v === "know" ? renderKnow() : renderLab();
  window.scrollTo({top:0, behavior:"smooth"});
}
/* 主题在 assets/theme.js 里，三个页面共用一个键 */

/* ---------- 启动 ---------- */
function footText(){
  const n = CHAPS.length, m = Object.keys(LABS).reduce((s, k) => s + LABS[k].length, 0);
  return "YF308AI实验室开放学习平台　机器学习及实战　" + n + " 章，" + m + " 道练习。前置课程是 <a href=\"../python/index.html\">Python 入门</a>。<br><span id=\"engtag\"></span>";
}
async function loadCourse(){
  try{
    const r = await fetch("data/course.json", {cache:"no-store"});
    if(r.ok){
      const j = await r.json();
      if(j && j.chapters && j.chapters.length) return j;
    }
  }catch(err){}
  return null;
}
(async function init(){
  const data = await loadCourse();
  if(!data){
    document.getElementById("know-body").innerHTML = '<p class="empty">课程数据没加载出来，刷新页面重试。</p>';
    return;
  }
  CHAPS = data.chapters.slice().sort((a, b) => Number(a.n) - Number(b.n));
  LABS = data.lab || {};
  part = Number(CHAPS[0].n);
  document.getElementById("foot").innerHTML = footText();
  renderParts(); renderKnow();
  const tag = function(s){ const t = document.getElementById("engtag"); if(t) t.textContent = s; };
  tag("正在加载 Python 运行环境");
  Runner.boot("python", function(s){ if(s) tag(s); }).then(function(r){
    tag(r.label + "。scikit-learn 第一次用到时再下载。");
  }).catch(function(err){
    tag("Python 运行环境没加载起来：" + (err && err.message || err) + "。刷新页面重试。");
  });
})();
</script>
<script src="../assets/split.js"></script>
